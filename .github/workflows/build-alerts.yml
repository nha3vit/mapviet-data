# Builds the MapViet alert pack (cameras.bin + signs.bin) by merging VietHUD's signed
# speedmap data with the VietMap point database (sources/vietmap/secrect.bin) and WYN points
# (sources/wyn/wyn_points.csv), removing duplicates (R4 standard), and publishes it to the
# fixed release tag "alerts" (never marked "latest", so the road-network URL releases/latest/download/ is untouched).
# App URL: https://github.com/<owner>/mapviet-data/releases/download/alerts/manifest.txt
# Required repo secret: MAPVIET_SIGNING_KEY (same key as build-network).
name: build-alerts

on:
  schedule:
    - cron: "0 2 * * *"      # 09:00 Vietnam time
  push:
    branches: [main]
    paths:
      - "sources/vietmap/**"
      - "sources/wyn/**"
      - "sources/curated/**"
      - "sources/osm/**"
      - "build_clean_alerts.py"
      - "vietmap_decode.py"
      - "sign_manifest.py"
      - "validate_speedmap.py"
      - "verify_viethud.py"
      - "tests/**"
      - ".github/workflows/build-alerts.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-alerts
  cancel-in-progress: false

env:
  VIETHUD_SPEEDMAP: https://raw.githubusercontent.com/911273/VietHUD/main/speedmap
  ROAD_NETWORK_URL: https://github.com/nha3vit/mapviet-data/releases/latest/download
  RELEASE_TAG: alerts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install cryptography==50.0.1

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_postprocess test_urban_flags -v

      - name: Build clean nationwide alert pack & sign
        env:
          MAPVIET_SIGNING_KEY: ${{ secrets.MAPVIET_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$MAPVIET_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          export MAPVIET_SIGNING_KEY_FILE="$RUNNER_TEMP/key.pem"
          export MAPVIET_ALERTS_VERSION="$(date -u +%Y.%m.%d.%H%M)"
          python build_clean_alerts.py --vietmap sources/vietmap/secrect.bin --wyn sources/wyn/wyn_points.csv --out alerts_out --version "$MAPVIET_ALERTS_VERSION" --alerts-only
          rm -f "$RUNNER_TEMP/key.pem"
          test -s alerts_out/manifest.txt.sig
          echo "CONTENT_SHA=$(python -c 'import json;print(json.load(open("alerts_out/stats.json"))["content_sha256"])')" >> "$GITHUB_ENV"

      - name: Validate alert pack
        run: |
          python validate_speedmap.py alerts_out --alerts-only

      - name: Skip if content unchanged
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view "$RELEASE_TAG" --json body -q .body 2>/dev/null | grep '^content_sha256:' | cut -d' ' -f2 || true)
          if [ "$last" = "$CONTENT_SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Alert data unchanged ($CONTENT_SHA)"
          fi

      - name: Publish release "alerts"
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd alerts_out
          python - <<'EOF' > notes.txt
          import json
          s = json.load(open("stats.json"))
          counts = s.get("counts_by_source_and_type", {})
          wyn_cnt = counts.get("WYN", {})
          osm_cnt = counts.get("OSM", {})
          cur_cnt = counts.get("CURATED", {})
          vm_cnt = counts.get("VietMap", {})

          print(f"MapViet Clean Nationwide Alert Pack (v{s.get('version', '')})")
          print(f"version: {s.get('version', '')}")
          print(f"vietmap_version: {s.get('vietmap_version', '')}")
          print(f"total_points: {s.get('total_points', 0)} (WYN {sum(wyn_cnt.values()):,} + OSM Lights {osm_cnt.get('light', 0):,} + Curated {sum(cur_cnt.values()):,} + VietMap {sum(vm_cnt.values()):,})")
          print(f"cameras: {s.get('cameras_count', 0)} (WYN {wyn_cnt.get('camera', 0):,} + Curated {cur_cnt.get('camera', 0):,} + VietMap {vm_cnt.get('camera_total', 0):,})")
          print(f"signs: {s.get('signs_count', 0)}")
          print("\n• Tích hợp kho đèn tín hiệu thực địa OSM + WYN + Curated toàn quốc (6.269 điểm ngã tư).")
          print("• Khử trùng lặp nội bộ WYN <= 30m cùng hướng và chặn VietMap Type 4 cứu hướng kế thừa nhầm tốc độ từ nhánh phụ <= 40 km/h hoặc cầu vượt cắt ngang.")
          print("• Đã ký số xác thực ECDSA P-256 bằng khoá MapViet.")
          print(f"content_sha256: {s['content_sha256']}")
          EOF
          cat notes.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" cameras.bin signs.bin stats.json --clobber
            gh release upload "$RELEASE_TAG" manifest.txt manifest.txt.sig --clobber
            gh release edit "$RELEASE_TAG" --title "MapViet Clean Nationwide Alert Pack (v$(python -c 'import json; print(json.load(open("stats.json"))["version"])'))" --notes-file notes.txt --latest=false
          else
            gh release create "$RELEASE_TAG" --title "MapViet Clean Nationwide Alert Pack (v$(python -c 'import json; print(json.load(open("stats.json"))["version"])'))" --notes-file notes.txt \
              --latest=false cameras.bin signs.bin stats.json manifest.txt manifest.txt.sig
          fi
