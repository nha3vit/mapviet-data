# Copy this file to <owner>/mapviet-data : .github/workflows/build-network.yml
# Builds the MapViet road-network pack from the latest OpenStreetMap Vietnam
# extract every day and publishes it to the fixed release tag "roads" (marked "latest").
# App URL: https://github.com/<owner>/mapviet-data/releases/download/roads/manifest.txt
# Required repo secret: MAPVIET_SIGNING_KEY  (EC P-256 private key, PEM text)
name: build-network

on:
  schedule:
    - cron: "30 1 * * *"     # 08:30 Vietnam time, after Geofabrik's nightly extract
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-network
  cancel-in-progress: false

env:
  PBF_URL: https://download.geofabrik.de/asia/vietnam/vietnam-latest.osm.pbf
  VIETHUD_REPO: https://github.com/911273/VietHUD.git
  VIETHUD_REF: f9f4ca283860ee873e8c5d5ed715036c75818d10   # public canonical VietHUD pipeline (matches local tools/viethud-pipeline)
  RELEASE_TAG: roads

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "osmium>=3.6,<5" cryptography==50.0.1

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest test_postprocess test_urban_flags -v

      - name: Download OSM Vietnam (verify md5)
        run: |
          # Geofabrik redirects *-latest to a dated file (e.g. asia/vietnam/vietnam-YYMMDD.osm.pbf);
          # resolve it once so the data, its .md5 and the date all refer to the same file.
          CURL_OPTS="-4 --retry 5 --retry-delay 10 --retry-all-errors"
          REAL_URL=$(curl $CURL_OPTS -fsSIL -o /dev/null -w '%{url_effective}' "$PBF_URL" || curl --retry 5 --retry-delay 10 -fsSIL -o /dev/null -w '%{url_effective}' "$PBF_URL")
          echo "Resolved: $REAL_URL"
          curl $CURL_OPTS -fsSL -o vietnam.osm.pbf "$REAL_URL"
          curl $CURL_OPTS -fsSL "$REAL_URL.md5" | awk '{print $1"  vietnam.osm.pbf"}' > pbf.md5
          md5sum -c pbf.md5
          echo "OSM_DATE=$(curl $CURL_OPTS -fsSI "$REAL_URL" | awk -F': ' 'tolower($1)=="last-modified"{print $2}' | tail -1 | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Skip if OSM unchanged since last release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view "$RELEASE_TAG" --json body -q .body 2>/dev/null | grep '^osm_date:' | cut -d' ' -f2- || true)
          assets_ok=true
          if ! assets_json=$(gh release view "$RELEASE_TAG" --json assets -q '[.assets[].name]' 2>/dev/null); then
            assets_ok=false
          else
            for req in manifest.txt manifest.txt.sig metadata.bin.gz index.bin.gz tiles.bin.gz names.bin.gz seg_names.bin.gz lights.bin.gz osm_signs.bin.gz osm_danger_refs.json.gz; do
              if ! printf '%s\n' "$assets_json" | grep -Fq "\"$req\""; then
                assets_ok=false
                break
              fi
            done
          fi
          if [ "$last" = "$OSM_DATE" ] && [ "$assets_ok" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "OSM unchanged ($OSM_DATE) and roads release assets complete"
          fi

      - name: Fetch VietHUD pipeline (pinned)
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --filter=blob:none --no-checkout "$VIETHUD_REPO" viethud
          git -C viethud checkout "$VIETHUD_REF" -- tools/viethud-pipeline

      - name: Build network from OSM
        if: steps.check.outputs.skip != 'true'
        run: |
          export VIETHUD_PIPELINE_HOME="$PWD/pipe_home"
          mkdir -p pipe_home/empty out
          cd viethud/tools/viethud-pipeline
          python synthesize_and_pack.py --pbf "$GITHUB_WORKSPACE/vietnam.osm.pbf" \
            --out "$GITHUB_WORKSPACE/out" --region VN --custom-alerts "$GITHUB_WORKSPACE/pipe_home/empty"

      - name: Tag urban segments
        if: steps.check.outputs.skip != 'true'
        run: |
          python urban_flags.py "$GITHUB_WORKSPACE/vietnam.osm.pbf" "$GITHUB_WORKSPACE/out" | tee urban.log
          echo "URBAN_COUNT=$(grep 'Total urban segments:' urban.log | awk '{print $NF}')" >> "$GITHUB_ENV"

      - name: Enrich speed limits & street names from VietMap roadsen
        if: steps.check.outputs.skip != 'true'
        run: |
          python enrich_network.py "$GITHUB_WORKSPACE/out" \
            --vietmap sources/vietmap/secrect.bin \
            --manifest sources/vietmap/vietmap_manifest.json | tee enrich.log

      - name: Package + sign + extract rail/bridge danger refs
        if: steps.check.outputs.skip != 'true'
        env:
          MAPVIET_SIGNING_KEY: ${{ secrets.MAPVIET_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$MAPVIET_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          export MAPVIET_SIGNING_KEY_FILE="$RUNNER_TEMP/key.pem"
          export MAPVIET_NETWORK_VERSION="$(date -u +%Y.%m.%d.%H%M)"
          echo "VERSION=$MAPVIET_NETWORK_VERSION" >> "$GITHUB_ENV"
          python postprocess.py out release
          python extract_osm_danger_refs.py "$GITHUB_WORKSPACE/vietnam.osm.pbf" release/osm_danger_refs.json.gz
          rm -f "$RUNNER_TEMP/key.pem"

      - name: Verify release package
        if: steps.check.outputs.skip != 'true'
        run: |
          tmpdir=$(mktemp -d)
          cp release/manifest.txt release/manifest.txt.sig release/osm_signs.bin.gz "$tmpdir/"
          python verify_road_signs.py "$tmpdir"
          rm -rf "$tmpdir"
          python - <<'EOF'
          import gzip, hashlib, pathlib
          rel = pathlib.Path("release")
          lines = (rel / "manifest.txt").read_text(encoding="utf-8").splitlines()
          entries = lines[1:]
          assert len(entries) == 7, f"Expected 7 manifest entries, got {len(entries)}"
          for line in entries:
              fn, size_s, sha, gz_s = line.split()
              gz_p = rel / f"{fn}.gz"
              assert gz_p.exists(), f"Missing {gz_p}"
              assert gz_p.stat().st_size == int(gz_s), f"GZ size mismatch for {fn}"
              h = hashlib.sha256()
              total = 0
              with gzip.open(gz_p, "rb") as f:
                  while chunk := f.read(1 << 20):
                      h.update(chunk)
                      total += len(chunk)
              assert total == int(size_s), f"Raw size mismatch for {fn}"
              assert h.hexdigest() == sha.lower(), f"SHA-256 mismatch for {fn}"
          print(f"Verified all {len(entries)} compressed assets in release/")
          EOF

      - name: Publish release "roads"
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          printf 'MapViet road network built from OpenStreetMap (ODbL, (c) OpenStreetMap contributors).\nosm_date: %s\nversion: %s\nurban_segments: %s\n' "$OSM_DATE" "$VERSION" "$URBAN_COUNT" > notes.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.gz --clobber
            gh release upload "$RELEASE_TAG" manifest.txt manifest.txt.sig --clobber
            gh release edit "$RELEASE_TAG" --title "MapViet Road Network (v$VERSION)" --notes-file notes.txt --latest
          else
            gh release create "$RELEASE_TAG" --title "MapViet Road Network (v$VERSION)" --notes-file notes.txt --latest \
              *.gz manifest.txt manifest.txt.sig
          fi
